  - Unclassified access weakness is present
  postconditions:
  - Unauthorized access established
  - First tool instance deployed
  source: Synthetic case study data

- id: threat-step-research-document-collection
  type: ThreatStep
  name: Research Document Collection
  description: Simulated collection of restricted research results by abusing an accessible research session with the second tool.
