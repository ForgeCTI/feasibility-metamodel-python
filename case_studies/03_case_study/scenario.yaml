  description: Fictional phishing campaign targeting employees in the consulting sector.
  first_seen: '2026-10-14'
  last_seen: '2026-10-22'
  status: Completed
  objective: Steal employee credentials through fraudulent login pages.
  source: Synthetic case study data

- id: threat-employee-credential-theft
  type: Threat
  name: Employee Credential Theft
  description: Phishing threat seeking to compromise a consulting employee account.
  objective: Obtain employee login credentials for unauthorized access.
  first_seen: '2026-10-15'
  last_seen: '2026-10-21'
  source: Synthetic case study data

- id: step-phishing-email-delivery
  type: ThreatStep
  name: Phishing Email Delivery
  description: Delivery of a fraudulent business email containing a link to a fake corporate login page.
  phase: Initial Access
  objective: Direct a Bluehaven employee to a fraudulent login page.
  preconditions:
  - A target employee email address is known.
  postconditions:
  - A phishing email containing the deceptive link has been delivered.
  source: Synthetic case study data

- id: step-credential-capture
  type: ThreatStep
  name: Credential Capture
  description: An employee follows the phishing link and enters credentials into the fraudulent login page.
  phase: Credential Access
  objective: Capture the employee login credentials.
  preconditions:
  - The phishing message has been delivered to the employee.
  postconditions:
  - The attacker has obtained the submitted credentials.
  source: Synthetic case study data

- id: ttp-spearphishing-link
  type: TTP
  name: Spearphishing Link
  description: Social-engineering delivery of a malicious link through email.
  external_id: T1566.002
  tactic: Initial Access
  technique: Phishing
  subtechnique: Spearphishing Link
  source: MITRE ATT&CK (scenario mapping)

- id: ttp-web-portal-capture
  type: TTP
  name: Web Portal Capture
  description: Capture of credentials submitted through a deceptive login portal.
  external_id: T1056.003
  tactic: Credential Access
  technique: Input Capture
  subtechnique: Web Portal Capture
  source: MITRE ATT&CK (scenario mapping)

