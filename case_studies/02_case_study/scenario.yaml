# Case Study 02 - Logistics Tracking Infrastructure

# Scenario-level IDs refer to entities in the relationships section.
# The metamodel generates internal UUIDs when loading this scenario.

metadata:
  name: Case Study 02 - Logistics Tracking Infrastructure
  description: Fictional Northstar Logistics shipment tracking infrastructure.
  status: implemented

entities:
- id: org-northstar-logistics
  type: Organization
  name: Northstar Logistics
  description: Fictional company providing logistics and shipment services.
  legal_name: Northstar Logistics S.r.l.
  short_name: NL
  website: https://northstar-logistics.example
  organization_size: Medium
  criticality: High
  maturity_level: Intermediate
  source: Synthetic case study data

- id: sector-logistics-transportation
  type: Sector
  name: Logistics and Transportation
  description: Transportation, warehousing, and logistics services.
  sector_code: '52.29'
  sector_standard: NACE
  sector_standard_version: Rev. 2
  source: Synthetic case study data

- id: infra-northstar-shipment-tracking
  type: Infrastructure
  name: Northstar Shipment Tracking Infrastructure
  description: IT infrastructure supporting shipment tracking operations.
  environment_type: Production
  scope: Shipment tracking and logistics management
  source: Synthetic case study data

- id: nodetype-application-server
  type: NodeType
  name: Application Server
  description: Server category responsible for executing the shipment tracking application.
  category: Server
  source: Synthetic case study data

- id: nodetype-database-server
  type: NodeType
  name: Database Server
  description: Server category responsible for storing and managing shipment tracking data.
  category: Server
  source: Synthetic case study data

- id: node-tracking-application-server
  type: Node
  name: Tracking Application Server
  description: Server hosting the shipment tracking application used by logistics operators.
  hostname: srv-tracking-app-01
  ip_addresses:
  - 192.0.2.21
  mac_addresses:
  - 02:00:00:00:00:21
  fqdn: srv-tracking-app-01.northstar-logistics.example
  source: Synthetic case study data

- id: node-tracking-database-server
  type: Node
  name: Tracking Database Server
  description: Server responsible for storing shipment records, tracking events, and delivery data.
  hostname: srv-tracking-db-01
  ip_addresses:
  - 192.0.2.22
  mac_addresses:
  - 02:00:00:00:00:22
  fqdn: srv-tracking-db-01.northstar-logistics.example
  source: Synthetic case study data

- id: connection-tracking-database
  type: Connection
  name: Tracking Database Connection
  description: Encrypted network connection between the tracking application server and the database server.
  protocol: TCP
  encrypted: true
  allowed: true
  source: Synthetic case study data

- id: resource-shipment-tracking-database
  type: Resource
  name: Shipment Tracking Database
  description: Database resource used to store shipment records and tracking events.
  source: Synthetic case study data

- id: resource-tracking-application-files
  type: Resource
  name: Shipment Tracking Application Files
  description: Application deployment files and configuration resources hosted on the tracking application server.
  source: Synthetic case study data

- id: information-shipment-tracking-records
  type: Data
  name: Shipment Tracking Records
  description: Shipment identifiers, current delivery statuses, and tracking events stored as JSON documents.
  format: JSON
  source: Synthetic case study data

- id: informationtype-shipment-tracking-data
  type: DataType
  name: Shipment Tracking Data
  description: Information category describing operational shipment tracking and delivery data.
  category: Operational Data
  source: Synthetic case study data

- id: code-shipment-tracking-service
  type: Code
  name: Shipment Tracking Service Code
  description: Python application code responsible for processing shipment tracking events and retrieving shipment
    records.
  language: Python
  version: 1.8.0
  repository_url: https://git.northstar-logistics.example/tracking-service
  source: Synthetic case study data

- id: application-northstar-tracking
  type: Application
  name: Northstar Shipment Tracking Application
  description: Software product used to manage shipment tracking and logistics operations.
  vendor: Northstar Logistics
  product: Northstar Tracking Platform
  version: 1.8.0
  cpe: cpe:2.3:a:northstar_logistics:northstar_tracking_platform:1.8.0:*:*:*:*:*:*:*
  source: Synthetic case study data

- id: appinstance-northstar-tracking-production
  type: ApplicationInstance
  name: Northstar Tracking Production Instance
  description: Production deployment of the shipment tracking application on the application server.
  version: 1.8.0
  runtime_state: Running
  source: Synthetic case study data

- id: port-postgresql-5432
  type: Port
  name: PostgreSQL Database Port
  description: TCP port used by the PostgreSQL database service to receive shipment tracking queries.
  number: 5432
  protocol: tcp
  service_name: postgresql
  state: open
  source: Synthetic case study data

- id: code-postgresql-database-service
  type: Code
  name: PostgreSQL Database Service Code
  description: PostgreSQL server implementation responsible for handling database connections and queries.
  language: C
  version: '16.4'
  repository_url: https://github.com/postgres/postgres
  source: Synthetic case study data

