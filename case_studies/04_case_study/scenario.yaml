  patch_level: October 2026 baseline
  support_status: Supported
  source: Synthetic case study data

- id: code-order-maintenance-script
  type: Code
  name: Order Maintenance Script
  description: Python maintenance script used by authorized administrators for controlled updates to order records.
  language: Python
  version: 1.3.0
  repository_url: https://git.meridian-industrial.example/ops/order-maintenance
  source: Synthetic case study data

- id: threat-actor-foundry-access-group
  type: ThreatActor
  name: Foundry Access Group
  description: Fictional financially motivated threat group responsible for the simulated intrusion.
  aliases:
  - Foundry Crew
  motivation: Financial gain
  sophistication: Moderate
  country: Unknown
  source: Synthetic case study data

- id: threat-order-portal-compromise
  type: Threat
  name: Order Portal Compromise
  description: Coordinated attempt to gain unauthorized access to the order portal and manipulate customer orders.
  objective: Alter order records and disrupt order fulfilment
  first_seen: '2026-10-20'
  last_seen: '2026-10-22'
  source: Synthetic case study data

- id: threat-step-order-portal-exploitation
  type: ThreatStep
  name: Order Portal Exploitation
  description: Initial attack step exploiting weak input validation to bypass access controls in the public order portal.
  phase: Initial Access
  objective: Gain unauthorized access to the order portal
  preconditions:
  - Portal is reachable
  - Shared runtime vulnerability is unpatched
  postconditions:
  - Unauthorized portal functions accessible
  source: Synthetic case study data

- id: threat-step-maintenance-script-abuse
  type: ThreatStep
  name: Maintenance Script Abuse
  description: Follow-on step abusing excessive maintenance-script privileges to alter order records without authorization.
  phase: Execution
  objective: Change order status without authorization
  preconditions:
  - Portal access achieved
  - Maintenance script privileges are excessive
  postconditions:
  - Order records can be modified without authorization
  source: Synthetic case study data

- id: ttp-exploit-public-facing-application
  type: TTP
  name: Exploit Public-Facing Application
  description: MITRE ATT&CK technique describing exploitation of an internet-facing application to obtain access.
  external_id: T1190
  tactic: Initial Access
  technique: Exploit Public-Facing Application
  subtechnique: null
  source: MITRE ATT&CK (scenario technique mapping)

- id: ttp-python-interpreter
  type: TTP
  name: 'Command and Scripting Interpreter: Python'
  description: MITRE ATT&CK technique describing adversarial execution of Python commands or scripts.
  external_id: T1059.006
  tactic: Execution
  technique: Command and Scripting Interpreter
  subtechnique: Python
  source: MITRE ATT&CK (scenario technique mapping)

- id: software-vulnerability-shared-runtime
  type: SoftwareVulnerability
  name: Shared Runtime Input Validation Weakness
  description: Fictional weakness in input validation within a shared runtime used by the application and operating system.
  external_id: MIS-SW-001
  severity: High
  cvss_score: 8.8
  cve_id: null
  cwe_id: CWE-20
  affected_versions:
  - Shared Runtime 2.5.0
  source: Synthetic case study data

- id: config-vulnerability-maintenance-permissions
  type: ConfigVulnerability
  name: Insecure Maintenance Script Permissions
  description: Fictional configuration weakness granting more privileges than necessary to the order maintenance script.
  external_id: MIS-CFG-001
  severity: High
  cvss_score: 7.5
  misconfiguration_type: Excessive Script Privileges
  detectability: Moderate
  source: Synthetic case study data

- id: attack-tool-remote-order-manipulation
  type: AttackTool
  name: Remote Order Manipulation Utility
  description: Fictional post-exploitation utility able to interact with compromised portal functions and change orders.
  aliases:
  - order-admin-kit
  tool_type: Post-exploitation utility
  capabilities:
