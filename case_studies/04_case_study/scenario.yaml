  type: Organization
  name: Meridian Industrial Systems
  description: Fictional manufacturer of industrial components whose customer orders are managed through a corporate web portal.
  legal_name: Meridian Industrial Systems S.r.l.
  short_name: MIS
  website: https://meridian-industrial.example
  organization_size: Medium
  criticality: High
  maturity_level: Intermediate
  source: Synthetic case study data

- id: sector-industrial-components-manufacturing
  type: Sector
  name: Industrial Components Manufacturing
  description: Manufacture and machining of industrial metal components, classified under the NACE system.
  sector_code: '25.62'
