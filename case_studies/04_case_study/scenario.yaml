# Case Study 04 - Exploitation of a Vulnerable Enterprise System
# Entity IDs are scenario references; runtime UUIDs are generated automatically.

metadata:
  name: Case Study 04 - Exploitation of a Vulnerable Enterprise System
  description: Fictional Meridian Industrial Systems enterprise order portal exploitation scenario.
  status: implemented

entities:
