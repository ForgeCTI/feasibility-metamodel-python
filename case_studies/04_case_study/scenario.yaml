  - Order status modification
  source: Synthetic case study data

- id: attack-tool-instance-order-server
  type: AttackToolInstance
  name: Order Server Intrusion Utility Instance
  description: Concrete simulated deployment of the intrusion utility on the compromised order application server.
  observed_version: 0.9.0
