# Case Study 01 - Healthcare Organization IT Infrastructure

# Scenario-level IDs are used to reference entities in relationships.
# The metamodel generates its own internal UUIDs when the scenario is loaded.

metadata:
  name: "Case Study 01 - Healthcare Organization IT Infrastructure"
  description: "Fictional Clinica Aurora patient booking infrastructure."
  status: "implemented"

entities:
  - id: org-clinica-aurora
    type: Organization
    name: "Clinica Aurora"
    description: "Fictional private healthcare clinic."
    legal_name: "Clinica Aurora S.r.l."
    short_name: "CA"
    website: "https://clinica-aurora.example"
    organization_size: "Medium"
    criticality: "High"
    maturity_level: "Intermediate"
    source: "Synthetic case study data"

  - id: sector-healthcare
    type: Sector
    name: "Healthcare"
    description: "Hospital and healthcare services."
    sector_code: "86.10"
    sector_standard: "NACE"
    sector_standard_version: "Rev. 2"
    source: "Synthetic case study data"

  - id: infra-clinica-aurora
    type: Infrastructure
    name: "Clinica Aurora IT Infrastructure"
    description: "IT infrastructure supporting patient bookings."
    environment_type: "Production"
    scope: "Patient appointment booking system"
    source: "Synthetic case study data"

  - id: node-booking-server
    type: Node
    name: "Booking Server"
    description: "Application server hosting the patient appointment booking system."
    hostname: "srv-booking-01"
    ip_addresses:
      - "192.0.2.10"
    mac_addresses:
      - "02:00:00:00:00:10"
    fqdn: "srv-booking-01.clinica-aurora.example"
    source: "Synthetic case study data"

  - id: os-ubuntu-server
    type: OS
    name: "Ubuntu Server 24.04 LTS"
    description: "Operating system product used by the booking server."
    vendor: "Canonical"
    product: "Ubuntu Server"
    version: "24.04 LTS"
    cpe: "cpe:2.3:o:canonical:ubuntu_linux:24.04:*:*:*:*:*:*:*"
    source: "Synthetic case study data"

  - id: osinstance-booking-server
    type: OSInstance
    name: "Booking Server OS Installation"
    description: "Ubuntu Server installation on the booking server."
    version: "24.04 LTS"
    build: "6.8.0-45-generic"
    patch_level: "October 2026 security update baseline"
    support_status: "Supported"
    source: "Synthetic case study data"

  - id: app-aurora-booking
    type: Application
    name: "Aurora Booking System"
    description: "Web application used to manage patient appointments and clinic reservations."
    vendor: "Aurora Software"
    product: "Aurora Booking"
    version: "2.4.1"
    cpe: "cpe:2.3:a:aurora_software:aurora_booking:2.4.1:*:*:*:*:*:*:*"
    source: "Synthetic case study data"

  - id: appinstance-aurora-booking
    type: ApplicationInstance
    name: "Aurora Booking Production Instance"
    description: "Production deployment of the booking application on the clinic server."
    version: "2.4.1"
    runtime_state: "Running"
    source: "Synthetic case study data"

  - id: port-booking-https
    type: Port
    name: "Booking HTTPS Port"
    description: "TCP port used to expose the patient booking web service over HTTPS."
    number: 443
    protocol: "tcp"
    service_name: "https"
    state: "open"
    source: "Synthetic case study data"

  - id: user-booking-operator
    type: User
    name: "Booking Office Operator"
    description: "Administrative account used to manage patient appointments."
    username: "booking.operator01"
    email: "booking.operator@clinica-aurora.example"
    role: "Booking office clerk"
    mfa_enabled: true
    source: "Synthetic case study data"

  - id: usertype-administrative-staff
    type: UserType
    name: "Administrative Staff"
    description: "User category for clinic employees managing administrative operations."
    privilege_level: "Standard"
    source: "Synthetic case study data"

  - id: country-italy
    type: HomeCountry
    name: "Italy"
    description: "Country where Clinica Aurora is located."
    iso2_code: "IT"
    iso3_code: "ITA"
    region: "Southern Europe"
    source: "Synthetic case study data"

  - id: body-european-union
    type: InternationalBody
    name: "European Union"
    description: "Supranational organization of which Italy is a member state."
    acronym: "EU"
    source: "Synthetic case study data"

relationships:
  - id: rel-operates-in
    type: operatesIn
    source: org-clinica-aurora
    target: sector-healthcare

  - id: rel-manages
    type: manages
    source: org-clinica-aurora
    target: infra-clinica-aurora

  - id: rel-made-by
    type: madeBy
    source: infra-clinica-aurora
    target: node-booking-server

  - id: rel-runs-os
    type: runsOS
    source: node-booking-server
    target: osinstance-booking-server

  - id: rel-os-instance-of
    type: osInstanceOf
    source: osinstance-booking-server
    target: os-ubuntu-server

  - id: rel-runs-app
    type: runsApp
    source: node-booking-server
    target: appinstance-aurora-booking

  - id: rel-application-instance-of
    type: applicationInstanceOf
    source: appinstance-aurora-booking
    target: app-aurora-booking

  - id: rel-exposes-port
    type: exposesPort
    source: node-booking-server
    target: port-booking-https

  - id: rel-used-by
    type: usedBy
    source: infra-clinica-aurora
    target: user-booking-operator

  - id: rel-has-user-type
    type: hasUserType
    source: user-booking-operator
    target: usertype-administrative-staff

  - id: rel-based-in
    type: basedIn
    source: org-clinica-aurora
    target: country-italy

  - id: rel-country-part-of
    type: countryPartOf
    source: country-italy
    target: body-european-union
