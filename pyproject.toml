[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-feasibility-metamodel"
version = "0.1.0"
description = "Python package for modelling organization, infrastructure, and cyber-threat interactions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Metamodel Authors"}]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
networkx = ["networkx>=3.0"]
neo4j = ["neo4j>=5.0"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]
test = ["pytest>=8.0"]
all = ["PyYAML>=6.0", "networkx>=3.0", "neo4j>=5.0", "mkdocs", "mkdocs-material", "mkdocstrings[python]", "pytest>=8.0"]

[project.scripts]
metamodel = "metamodel.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"metamodel" = ["taxonomies/**/*.yaml"]
